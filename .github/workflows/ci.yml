name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          for f in $(find . -name '*.js' -o -name '*.mjs' | grep -v node_modules); do
            node --check "$f" || exit 1
          done
      - name: Unit tests
        # 纯逻辑 + 假 ctx，不需要 DSH 宿主，离线可跑。
        # 依赖真实 nekowhale 表情元数据的三条用例在干净机器上会自动 skip（不是失败）。
        run: node --test test/*.test.mjs
